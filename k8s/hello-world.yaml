# Sample hello world application, served publicly at
# https://hackathon.daria-and-nico.com/hello-world
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: tourism-technology-2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-world
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:5678
            - -text=Hello, World!
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: tourism-technology-2026
spec:
  type: ClusterIP
  selector:
    app: hello-world
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  namespace: tourism-technology-2026
spec:
  ingressClassName: nginx
  rules:
    - host: hackathon.daria-and-nico.com
      http:
        paths:
          # http-echo answers on every path, so no rewrite is needed.
          - path: /hello-world
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  number: 80
