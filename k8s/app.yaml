apiVersion: apps/v1
kind: Deployment
metadata:
  name: tourism-technology-2026
  namespace: tourism-technology-2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tourism-technology-2026
  template:
    metadata:
      labels:
        app: tourism-technology-2026
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tourism-technology-2026
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:5678
            - -text=tourism-technology-2026 deployment OK
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: tourism-technology-2026
  namespace: tourism-technology-2026
spec:
  type: ClusterIP
  selector:
    app: tourism-technology-2026
  ports:
    - name: http
      port: 80
      targetPort: http
