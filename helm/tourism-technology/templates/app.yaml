apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-caption-api
data:
  server.cjs: |
{{ .Files.Get "caption-server.cjs" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-site
data:
{{ (.Files.Glob "site/*").AsConfig | indent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
data:
  nginx.conf: |
{{ .Files.Get "nginx.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/site: {{ (.Files.Glob "site/*").AsConfig | sha256sum }}
        checksum/caption-api: {{ .Files.Get "caption-server.cjs" | sha256sum }}
        caption/config-revision: {{ .Values.caption.configRevision | quote }}
        checksum/nginx: {{ .Files.Get "nginx.conf" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caption-api
          image: node:24-alpine
          command: ["node", "--use-env-proxy", "/opt/caption/server.cjs"]
          env:
            - name: NODE_ENV
              value: production
            - name: CAPTION_PROVIDER
              value: {{ .Values.caption.provider | quote }}
            - name: CAPTION_MODEL
              value: {{ .Values.caption.model | quote }}
            - name: CAPTION_BASE_URL
              value: {{ .Values.caption.baseUrl | quote }}
            - name: CAPTION_N8N_WEBHOOK_URL
              value: {{ .Values.caption.n8nWebhookUrl | quote }}
            - name: CAPTION_N8N_AUTH_HEADER
              value: {{ .Values.caption.n8nAuthHeader | quote }}
            - name: CAPTION_N8N_AUTH_PREFIX
              value: {{ .Values.caption.n8nAuthPrefix | quote }}
            - name: CAPTION_JSON_MODE
              value: {{ .Values.caption.jsonMode | quote }}
            - name: CAPTION_TIMEOUT_MS
              value: {{ .Values.caption.timeoutMs | quote }}
            - name: CAPTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-caption-ai" .Release.Name) .Values.caption.existingSecret | quote }}
                  key: {{ .Values.caption.secretKey | quote }}
                  optional: true
          ports:
            - name: caption-api
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /healthz
              port: caption-api
          livenessProbe:
            httpGet:
              path: /healthz
              port: caption-api
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: caption-api
              mountPath: /opt/caption
              readOnly: true
        - name: web
          image: {{ .Values.image }}
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caption-api
          configMap:
            name: {{ .Release.Name }}-caption-api
        - name: site
          configMap:
            name: {{ .Release.Name }}-site
        - name: nginx
          configMap:
            name: {{ .Release.Name }}-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  ingressClassName: nginx
  rules:
    - host: hackathon.daria-and-nico.com
      http:
        paths:
          # nginx in the pod resolves assets by file name, so no rewrite is needed.
          - path: {{ .Values.ingress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 80
