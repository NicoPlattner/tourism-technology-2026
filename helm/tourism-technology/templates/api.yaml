# The API microservice: keeps the Google Analytics connection (refresh tokens,
# encrypted) in a folder on the node, so it survives restarts, redeploys and
# uninstalls, and answers under <ingress.path>/api. (The cluster has no
# storage class, and CI may not create RBAC roles.)
{{- $api := .Values.api }}
{{- $dataPath := printf "%s/%s" (trimSuffix "/" $api.dataPath) .Release.Name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-api
data:
  server.mjs: |
{{ .Files.Get "api/server.mjs" | required "api/server.mjs is missing: run npm run build in dashboard/" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: 1
  # One writer for the stored connection: stop the old pod before the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
      annotations:
        checksum/server: {{ .Files.Get "api/server.mjs" | sha256sum }}
        checksum/google: {{ .Values.googleSecretChecksum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The kubelet creates the node folder owned by root; hand it to the
        # API's user. Root here, but only with the CHOWN capability.
        - name: data-owner
          image: {{ $api.image }}
          command: ["chown", "1000:1000", "/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: api
          image: {{ $api.image }}
          command: ["node", "/app/server.mjs"]
          env:
            - name: PORT
              value: "8787"
            - name: DATA_DIR
              value: /data
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-google
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-google
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: code
          configMap:
            name: {{ .Release.Name }}-api
        - name: data
          hostPath:
            path: {{ $dataPath | quote }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - name: http
      port: 80
      targetPort: http
