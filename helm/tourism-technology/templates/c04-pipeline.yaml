# Live refresh of the Challenge 04 data product: a volume with the caches and published snapshots, a bootstrap
# Job per deploy (full run when nothing is published yet), and two CronJobs: "fast" (weather, snow, official
# forecast, re-dated actions) and "full" (all sources incl. TVB data via the TTF Data Space; models re-run
# only when their inputs changed). The API mounts the volume read-only and serves snapshots/current.
{{- if and .Values.c04Api.enabled .Values.c04Pipeline.enabled }}
{{- $p := .Values.c04Pipeline }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-c04-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $p.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-c04-refresh-r{{ .Release.Revision }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-c04-refresh
    spec:
{{- include "c04.pipelinePod" (dict "root" . "mode" "auto") }}
{{- range $name, $cfg := dict "fast" $p.fastSchedule "full" $p.fullSchedule }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-c04-{{ $name }}
spec:
  schedule: {{ $cfg | quote }}
  timeZone: Europe/Vienna
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ if eq $name "full" }}3600{{ else }}1800{{ end }}
      template:
        metadata:
          labels:
            app: {{ $.Release.Name }}-c04-refresh
        spec:
{{- include "c04.pipelinePod" (dict "root" $ "mode" $name) | indent 4 }}
{{- end }}
{{- end }}
