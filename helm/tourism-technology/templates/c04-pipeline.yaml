# Refresh of the Challenge 04 data product: a volume with caches and published snapshots, and two CronJobs,
# suspended unless switched on: "fast" (snow and weather only, no model fit) and "full" (all sources incl. TVB
# data via the TTF Data Space; models re-run only when their inputs changed). Nothing runs on deploy; a manual
# run is started by the deploy workflow (input c04_refresh). The API mounts the volume read-only.
{{- if and .Values.c04Api.enabled .Values.c04Pipeline.enabled }}
{{- $p := .Values.c04Pipeline }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-c04-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $p.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- range $name, $cfg := dict "fast" $p.fastSchedule "full" $p.fullSchedule }}
{{- $on := index $p.schedule $name }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-c04-{{ $name }}
spec:
  schedule: {{ $cfg | quote }}
  timeZone: Europe/Vienna
  # Off unless c04Pipeline.schedule.{{ $name }} is true; a manual run uses this CronJob as its template.
  suspend: {{ not $on }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ if eq $name "full" }}3600{{ else }}1800{{ end }}
      template:
        metadata:
          labels:
            app: {{ $.Release.Name }}-c04-refresh
        spec:
{{- include "c04.pipelinePod" (dict "root" $ "mode" $name) | indent 4 }}
{{- end }}
{{- end }}
