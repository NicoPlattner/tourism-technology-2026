image: nginxinc/nginx-unprivileged:1.27-alpine
ingress:
  path: /
api:
  image: node:22-alpine
  persistence:
    # true needs a storage class (e.g. microk8s enable hostpath-storage);
    # false keeps the Google connection only until the API pod restarts.
    enabled: false
    size: 64Mi
    storageClass: ""  # empty: the cluster's default storage class
# Set by the deploy workflow so the API restarts when the Google secret changes.
googleSecretChecksum: ""
