image: nginxinc/nginx-unprivileged:1.27-alpine
ingress:
  path: /

caption:
  provider: openai
  model: gpt-4.1-mini
  baseUrl: https://api.openai.com/v1
  n8nWebhookUrl: ""
  n8nAuthHeader: X-Caption-Key
  n8nAuthPrefix: ""
  jsonMode: json_schema
  timeoutMs: 8000
  existingSecret: ""
  secretKey: api-key
  configRevision: unconfigured

# Public binary assets supplied by the deployment workflow.
staticAssetConfigMaps: []
api:
  image: node:22-alpine
  persistence:
    # false keeps the Google connection only until the API pod restarts.
    enabled: true
    size: 64Mi
    # The cluster has no default class; "retain" keeps the data on the node
    # even if the claim is deleted.
    storageClass: microk8s-retain-hostpath
# Challenge 04 data API (api/c04), image from .github/workflows/c04-api-image.yaml.
c04Api:
  enabled: true
  image: ghcr.io/nicoplattner/c04-api:latest
  imagePullSecret: ""
# Live refresh of the c04 data product (models/refresh.py, image from pipeline/c04/Dockerfile).
c04Pipeline:
  # Off by default: only the release that serves the data product runs it (deploy workflow, branch demand-api).
  enabled: false
  image: ghcr.io/nicoplattner/c04-pipeline:latest
  size: 2Gi
  storageClass: microk8s-retain-hostpath
  fastSchedule: "23 5,11,17,23 * * *"   # Europe/Vienna: weather, snow, official forecast, re-dated actions
  fullSchedule: "41 3 * * *"            # all sources; models re-run only when their inputs changed
# Set by the deploy workflow so the API restarts when the Google secret changes.
googleSecretChecksum: ""
