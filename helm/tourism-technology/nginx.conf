worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log off;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # Redirects stay relative so they work behind any ingress prefix.
  absolute_redirect off;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;

    location ~ /healthz$ {
      default_type text/plain;
      return 200 "demand-radar ok\n";
    }

    # Resolve both root and branch-prefixed caption requests to the same private API.
    location ~ /api/marketing/generate-caption$ {
      client_max_body_size 16k;
      proxy_pass http://127.0.0.1:8787/api/marketing/generate-caption;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 12s;
    }

    # Every branch is served under its own path prefix. Assets are resolved
    # by file name alone, so the app works under /, /<branch>/ or deeper.
    location ~ ^(?:.*/)?(?<file>[A-Za-z0-9_.-]+\.(?:js|css|png|svg|ico|json|txt|webmanifest))$ {
      try_files /$file =404;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Without a trailing slash, relative asset URLs would escape the prefix.
    location ~ ^(?<p>.*[^/])$ {
      return 308 $p/$is_args$args;
    }

    location / {
      try_files /index.html =404;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
    }
  }
}
