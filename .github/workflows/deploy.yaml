name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      deploy_root:
        description: Deploy to the domain root (only when explicitly requested)
        type: boolean
        default: false
        required: true

concurrency:
  group: pangolin-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Select deployment target
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          DEPLOY_ROOT: ${{ inputs.deploy_root }}
        run: |
          set -euo pipefail
          # Safe branch names retain their spelling; other names get a unique slug.
          branch_hash=$(printf '%s' "$BRANCH_NAME" | sha256sum | cut -c1-16)
          if [[ "$BRANCH_NAME" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            path="/$BRANCH_NAME"
          else
            slug=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)
            path="/branch-${slug:-ref}-$branch_hash"
          fi
          release="branch-$branch_hash"
          if [[ "$DEPLOY_ROOT" == "true" ]]; then
            path=/
            release=tourism-root
          fi
          printf 'DEPLOY_PATH=%s\nRELEASE_NAME=%s\n' "$path" "$release" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test:unit

      - name: Validate nginx routing
        run: |
          web_image=$(awk '/^image:/ {print $2}' helm/tourism-technology/values.yaml)
          docker run --rm --user 101 --tmpfs /tmp \
            --mount "type=bind,src=$GITHUB_WORKSPACE/helm/tourism-technology/nginx.conf,dst=/etc/nginx/nginx.conf,readonly" \
            --entrypoint nginx "$web_image" -t

      - name: Validate Helm chart
        run: helm lint helm/tourism-technology

      - name: Validate Pangolin secrets
        env:
          PANGOLIN_ID: ${{ secrets.PANGOLIN_ID }}
          PANGOLIN_SECRET: ${{ secrets.PANGOLIN_SECRET }}
          PANGOLIN_ENDPOINT: ${{ secrets.PANGOLIN_ENDPOINT }}
        run: |
          : "${PANGOLIN_ID:?Set PANGOLIN_ID}"
          : "${PANGOLIN_SECRET:?Set PANGOLIN_SECRET}"
          : "${PANGOLIN_ENDPOINT:?Set PANGOLIN_ENDPOINT}"

      - name: Set kubeconfig path
        run: printf 'KUBECONFIG=%s/kubeconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ vars.KUBECTL_VERSION || 'v1.31.14' }}

      - name: Install Pangolin
        run: |
          curl --fail --show-error --silent --location --max-time 60 \
            https://static.pangolin.net/get-cli.sh -o "$RUNNER_TEMP/install-pangolin.sh"
          sudo bash "$RUNNER_TEMP/install-pangolin.sh"

      - name: Configure Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "$KUBE_CONFIG" ]]; then
            echo "::error::Add the KUBE_CONFIG repository Actions secret."
            exit 1
          fi
          umask 077
          printf '%s\n' "$KUBE_CONFIG" > "$KUBECONFIG"
          kubectl config use-context microk8s

      - name: Connect Pangolin
        id: pangolin
        env:
          PANGOLIN_ID: ${{ secrets.PANGOLIN_ID }}
          PANGOLIN_SECRET: ${{ secrets.PANGOLIN_SECRET }}
          PANGOLIN_ENDPOINT: ${{ secrets.PANGOLIN_ENDPOINT }}
        run: |
          sudo pangolin up --silent \
            --id "$PANGOLIN_ID" --secret "$PANGOLIN_SECRET" \
            --endpoint "$PANGOLIN_ENDPOINT" --override-dns

      - name: Wait for Pangolin and private DNS
        run: |
          for attempt in {1..12}; do
            if status=$(sudo pangolin status client --json) &&
              jq -e '.connected == true and .registered == true and .terminated != true' \
                <<< "$status" >/dev/null &&
              timeout 5s getent ahostsv4 k8s.daria-and-nico.private; then
              exit 0
            fi
            sudo resolvectl flush-caches || true
            sleep 5
          done
          echo "::error::Pangolin or private DNS is not ready."
          exit 1

      - name: Wait for Kubernetes API
        run: |
          for attempt in {1..12}; do
            if kubectl --request-timeout=10s get --raw=/version; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify namespace permissions
        run: |
          set -euo pipefail
          kubectl auth can-i create deployments -n tourism-technology-2026
          for namespace in default test kube-system; do
            result=$(kubectl auth can-i create deployments -n "$namespace" || true)
            [[ "$result" == "no" ]] || { echo "::error::Unexpected authorization result in $namespace"; exit 1; }
          done
          kubectl get deployments -n tourism-technology-2026

      - name: Configure caption API credentials
        env:
          CAPTION_API_KEY: ${{ secrets.CAPTION_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          N8N_WEBHOOK_KEY: ${{ secrets.N8N_WEBHOOK_KEY }}
          CAPTION_SECRET_KEY: ${{ vars.CAPTION_SECRET_KEY || 'api-key' }}
          CAPTION_PROVIDER: ${{ vars.CAPTION_PROVIDER || 'openai' }}
          CAPTION_EXISTING_SECRET: ${{ vars.CAPTION_EXISTING_SECRET }}
        run: |
          set -euo pipefail
          api_key="$CAPTION_API_KEY"
          if [[ -z "$api_key" ]]; then
            if [[ "$CAPTION_PROVIDER" == "n8n" ]]; then api_key="$N8N_WEBHOOK_KEY"; else api_key="$OPENAI_API_KEY"; fi
          fi
          if [[ -n "$api_key" && -z "$CAPTION_EXISTING_SECRET" ]]; then
            umask 077
            key_file="$RUNNER_TEMP/caption-api-key"
            trap 'rm -f "$key_file"' EXIT
            printf '%s' "$api_key" > "$key_file"
            kubectl -n tourism-technology-2026 create secret generic "$RELEASE_NAME-caption-ai" \
              --from-file="$CAPTION_SECRET_KEY=$key_file" --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Deploy Helm release
        env:
          CAPTION_PROVIDER: ${{ vars.CAPTION_PROVIDER || 'openai' }}
          CAPTION_MODEL: ${{ vars.CAPTION_MODEL || 'gpt-4.1-mini' }}
          CAPTION_BASE_URL: ${{ vars.CAPTION_BASE_URL || 'https://api.openai.com/v1' }}
          CAPTION_N8N_WEBHOOK_URL: ${{ vars.CAPTION_N8N_WEBHOOK_URL }}
          CAPTION_N8N_AUTH_HEADER: ${{ vars.CAPTION_N8N_AUTH_HEADER || 'X-Caption-Key' }}
          CAPTION_N8N_AUTH_PREFIX: ${{ vars.CAPTION_N8N_AUTH_PREFIX }}
          CAPTION_JSON_MODE: ${{ vars.CAPTION_JSON_MODE || 'json_schema' }}
          CAPTION_TIMEOUT_MS: ${{ vars.CAPTION_TIMEOUT_MS || '8000' }}
          CAPTION_EXISTING_SECRET: ${{ vars.CAPTION_EXISTING_SECRET }}
          CAPTION_SECRET_KEY: ${{ vars.CAPTION_SECRET_KEY || 'api-key' }}
        run: |
          helm upgrade --install "$RELEASE_NAME" helm/tourism-technology \
            --namespace tourism-technology-2026 --set-string "ingress.path=$DEPLOY_PATH" \
            --set-string "caption.provider=$CAPTION_PROVIDER" --set-string "caption.model=$CAPTION_MODEL" \
            --set-string "caption.baseUrl=$CAPTION_BASE_URL" --set-string "caption.jsonMode=$CAPTION_JSON_MODE" \
            --set-string "caption.n8nWebhookUrl=$CAPTION_N8N_WEBHOOK_URL" --set-string "caption.n8nAuthHeader=$CAPTION_N8N_AUTH_HEADER" \
            --set-string "caption.n8nAuthPrefix=$CAPTION_N8N_AUTH_PREFIX" \
            --set-string "caption.timeoutMs=$CAPTION_TIMEOUT_MS" --set-string "caption.existingSecret=$CAPTION_EXISTING_SECRET" \
            --set-string "caption.secretKey=$CAPTION_SECRET_KEY" --set-string "caption.configRevision=$GITHUB_RUN_ID" \
            --wait --timeout 3m

      - name: Verify dashboard through service
        run: |
          health_path="${DEPLOY_PATH%/}/healthz"
          kubectl -n tourism-technology-2026 port-forward "service/$RELEASE_NAME" 18081:80 \
            > "$RUNNER_TEMP/port-forward-app.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            if curl -fsS --max-time 5 "http://127.0.0.1:18081$health_path" | grep -Fq 'demand-radar ok' &&
              curl -fsSL --max-time 5 "http://127.0.0.1:18081$DEPLOY_PATH" | grep -Fq 'Demand Radar'; then
              curl -sS --max-time 5 -X POST -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:18081${DEPLOY_PATH%/}/api/marketing/generate-caption" | grep -Fq 'INVALID_METADATA'
              printf '\nService verified. URL: https://hackathon.daria-and-nico.com%s (public route not verified).\n' "$DEPLOY_PATH" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/port-forward-app.log"
          exit 1

      - name: Verify public URL
        run: |
          url="https://hackathon.daria-and-nico.com$DEPLOY_PATH"
          if curl --fail --silent --show-error --location --max-time 30 "$url" | grep -Fq 'Demand Radar'; then
            curl -sS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' "${url%/}/api/marketing/generate-caption" | grep -Fq 'INVALID_METADATA'
            printf 'Public URL verified: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Public URL verification failed: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Deployment diagnostics
        if: failure() && steps.pangolin.outcome == 'success'
        run: |
          kubectl --request-timeout=10s -n tourism-technology-2026 get deployments,services,ingresses,pods || true
          kubectl --request-timeout=10s -n tourism-technology-2026 get events --sort-by=.lastTimestamp || true

      - name: Pangolin diagnostics
        if: failure() && steps.pangolin.outcome == 'success'
        run: |
          sudo pangolin status client || true
          sudo pangolin logs client --lines 80 || true
          resolvectl status || true
          timeout 5s resolvectl query k8s.daria-and-nico.private || true

      - name: Disconnect
        if: always()
        run: |
          sudo pangolin down || true
          rm -f "$RUNNER_TEMP/kubeconfig" "$RUNNER_TEMP/install-pangolin.sh" "$RUNNER_TEMP/port-forward-app.log"
