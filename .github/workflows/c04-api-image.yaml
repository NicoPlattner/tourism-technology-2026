name: Build c04 data API and pipeline images

on:
  push:
    branches: [main]
    paths:
      - c04/**
      - .github/workflows/c04-api-image.yaml
  pull_request:
    paths:
      - c04/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Route tests
        run: |
          pip install -q -r c04/api/requirements-dev.txt
          pytest -q c04/api/tests
      - name: Build image
        run: docker build -f c04/api/Dockerfile -t c04-api:test .
      - name: Smoke test the container (same layout and user as in the cluster)
        run: |
          set -euo pipefail
          docker run -d --name c04 --read-only --tmpfs /tmp -e BASE_PATH=/smoke/c04-api -p 18080:8080 c04-api:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/smoke/c04-api/health && break; sleep 1; done
          curl -fsS "http://127.0.0.1:18080/smoke/c04-api/query?destination=Tirol&origin=80&start=2027-01-15&end=2027-03-15" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['nights']['value'] > 0"
          curl -fsS "http://127.0.0.1:18080/smoke/c04-api/actions?limit=3" | python3 -c "import json,sys; assert len(json.load(sys.stdin)) == 3"
          curl -fsS "http://127.0.0.1:18080/smoke/c04-api/forecast?start=2027-02-01&end=2027-02-01" > /dev/null
      - name: Container logs
        if: failure()
        run: docker logs c04 || true
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/c04-api"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag c04-api:test "$img:latest"
          docker tag c04-api:test "$img:${GITHUB_SHA}"
          docker push "$img:latest"
          docker push "$img:${GITHUB_SHA}"

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pipeline image
        run: docker build -f c04/pipeline/Dockerfile -t c04-pipeline:test .
      - name: Smoke test (imports, code layout, user)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python c04-pipeline:test -c "
          import sys, os; sys.path.insert(0, '/app/models'); sys.path.insert(0, '/app/data')
          import io, importlib, glob
          import lightgbm, sklearn, statsmodels, pandas, holidays, refresh, build_origin_panel, holiday_corrections
          # every pipeline script's imports must resolve (a missing parser broke fetch_tirol_stats once)
          local = {os.path.basename(x)[:-3] for x in glob.glob('/app/data/*.py') + glob.glob('/app/models/*.py')}
          for f in sorted(glob.glob('/app/data/*.py') + glob.glob('/app/models/*.py')):
              name = os.path.basename(f)[:-3]
              if name.startswith('probe_') or name in ('refresh',):
                  continue
              src = open(f).read()
              for line in src.splitlines():
                  if line.startswith(('import ', 'from ')) and ' import ' in line or line.startswith('import '):
                      mod = line.split()[1].split('.')[0]
                      if mod not in local and mod not in ('__future__', 'chronos', 'torch'):
                          importlib.import_module(mod)
          pandas.read_html(io.StringIO('<table><tr><th>a</th></tr><tr><td>1</td></tr></table>'))
          assert os.getuid() == 1000 and os.path.isdir('/app/baked-results/gui') and os.path.isdir('/app/pipeline/seed')
          print('ok', lightgbm.__version__, pandas.__version__)"
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/c04-pipeline"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag c04-pipeline:test "$img:latest"
          docker tag c04-pipeline:test "$img:${GITHUB_SHA}"
          docker push "$img:latest"
          docker push "$img:${GITHUB_SHA}"
